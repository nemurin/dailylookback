name: Create today's plan from yesterday's diary

on:
  schedule:
    # Runs at 21:00 UTC => 06:00 JST (Asia/Tokyo)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps & run generator (debug)
        env:
          MODEL: ${{ secrets.MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
          python .github/scripts/generate_priority_actions_gemini.py

      - name: Generate priority actions (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}
          TZ: Asia/Tokyo
        run: |
          python3 .github/scripts/generate_priority_actions_gemini.py

      - name: Commit generated priority actions (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary/*-actions.md || true
          git commit -m "chore: generate today's priority actions (Gemini)" || echo "No changes to commit"
          git push || echo "Push failed (maybe branch protection)."
