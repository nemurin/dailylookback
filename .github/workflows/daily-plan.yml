name: Create today's plan from yesterday's diary

on:
  schedule:
    # Runs at 21:00 UTC => 06:00 JST (Asia/Tokyo)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: pip install openai

      - name: Generate priority actions (LLM)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini # 任意で上書き可能
          TZ: Asia/Tokyo
        run: |
          python3 .github/scripts/generate_priority_actions_llm.py

      - name: Commit generated priority actions (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary/*-actions.md || true
          git commit -m "chore: generate today's priority actions (LLM)" || echo "No changes to commit"
          git push || echo "Push failed (maybe branch protection)."
