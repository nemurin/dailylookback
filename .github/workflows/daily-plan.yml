name: Create today's plan from yesterday's diary

on:
  schedule:
    # Runs at 21:00 UTC => 06:00 JST (Asia/Tokyo)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-cloud-aiplatform

      - name: Write GCP service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json
          # (Note) Do not echo the key to logs

      - name: Generate priority actions (Gemini)
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_LOCATION: 'asia-northeast1'   # 必要なら secret 化
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }} # optional
          TZ: Asia/Tokyo
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
        run: |
          python3 .github/scripts/generate_priority_actions_gemini.py

      - name: Commit generated priority actions (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diary/*-actions.md || true
          git commit -m "chore: generate today's priority actions (Gemini)" || echo "No changes to commit"
          git push || echo "Push failed (maybe branch protection)."
